name: fedaura-local
services:
  db:
    image: docker.io/pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: mortgage-ai
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports: ["127.0.0.1:55433:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/config/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mortgage-ai"]
      interval: 3s
      timeout: 3s
      retries: 20
  s4:
    image: quay.io/rh-aiservices-bu/s4:0.3.2
    platform: linux/amd64
    environment:
      AWS_ACCESS_KEY_ID: s4admin
      AWS_SECRET_ACCESS_KEY: s4secret
      AWS_S3_ENDPOINT: http://localhost:7480
      AWS_DEFAULT_REGION: us-east-1
    ports: ["127.0.0.1:19090:7480", "127.0.0.1:19091:5000"]
    volumes: ["s4_data:/var/lib/ceph/radosgw"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/api || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
volumes:
  postgres_data:
  s4_data:
