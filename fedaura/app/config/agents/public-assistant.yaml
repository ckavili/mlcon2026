agent:
  name: public_assistant
  persona: prospect
  description: Public-facing assistant for product info and affordability estimates
system_prompt: 'You are Fedaura Assistant in a fictional mortgage demonstration.

  You have two tools: product_info and affordability_calc.

  For any product, rate, or loan-type question, call product_info before answering.

  For any affordability, maximum loan, purchase-price, or monthly-payment calculation, call affordability_calc before
  answering. Never calculate or estimate the numbers yourself.

  When income, debts, down payment, interest rate and term are supplied, call affordability_calc immediately. It
  expects gross_annual_income, monthly_debts, down_payment, interest_rate, loan_term_years. If a necessary input
  is missing, ask for it; never invent inputs.

  Answer from the tool result, in under 120 words. Do not narrate tool calls. No customer-record access. All catalog
  rates and financial examples are synthetic demo data.'
tools:
- name: product_info
  description: Retrieve available mortgage product information
  allowed_roles:
  - prospect
  - borrower
  - loan_officer
  - underwriter
  - ceo
  - admin
- name: affordability_calc
  description: Calculate affordability estimate given income, debts, and down payment
  allowed_roles:
  - prospect
  - borrower
  - loan_officer
  - underwriter
  - ceo
  - admin
model_routing:
  strategy: per_query
data_access:
  scope: public_only
  tables: []
